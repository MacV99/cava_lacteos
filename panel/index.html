<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" href="/img/icon-192.png" />
  <link rel="apple-touch-icon" href="/img/icon-192.png" />

  <meta name="theme-color" content="#fafafa" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Cava Panel" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/styles.css" />
  <title>Cava Lácteos — Panel de Chats</title>
</head>
<body>

  <!-- ── Vista lista de chats ─────────────────────────────────────────────── -->
  <section id="view-list" class="view view--active">
    <header class="topbar">
      <div class="topbar__title">
        <h1>Chats</h1>
        <span id="chat-count" class="topbar__count"></span>
      </div>
      <button id="btn-conn" class="icon-btn" title="Conexiones" aria-label="Conexiones">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.2" r="1.1" fill="currentColor" stroke="none"/>
        </svg>
      </button>
      <button id="btn-refresh" class="icon-btn" title="Actualizar" aria-label="Actualizar">↻</button>
    </header>

    <div class="searchbar">
      <input id="search" type="search" placeholder="Buscar por nombre…" autocomplete="off" />
    </div>

    <div class="filterbar">
      <div class="filter-select">
        <select id="canal-filter" aria-label="Filtrar por canal">
          <option value="todos">Todos los canales</option>
          <option value="whatsapp">WhatsApp</option>
          <option value="messenger">Messenger</option>
          <option value="instagram">Instagram</option>
        </select>
        <span class="filter-select__chevron" aria-hidden="true">▾</span>
      </div>
    </div>

    <div id="chat-list" class="chat-list">
      <!-- chats inyectados por JS -->
    </div>

    <div id="empty" class="empty hidden">No hay chats todavía.</div>
    <div id="loading" class="empty">Cargando…</div>

    <button id="btn-install" class="install-btn hidden">Instalar app 📲</button>
  </section>

  <!-- ── Vista conversación ───────────────────────────────────────────────── -->
  <section id="view-chat" class="view">
    <header class="topbar">
      <button id="btn-back" class="icon-btn" aria-label="Volver">←</button>
      <div class="topbar__contact">
        <span id="chat-canal" class="canal-badge"></span>
        <div>
          <strong id="chat-nombre" class="editable" title="Tocar para editar el nombre">—</strong>
          <small id="chat-ultima"></small>
        </div>
      </div>
      <label class="switch" title="IA activa para este chat">
        <input type="checkbox" id="chat-toggle" />
        <span class="switch__slider"></span>
      </label>
    </header>

    <div id="conversation" class="conversation"></div>

    <!-- Placeholder solo en desktop cuando no hay chat seleccionado -->
    <div id="chat-empty" class="chat-empty">
      <div class="chat-empty__icon" aria-hidden="true">💬</div>
      <p>Selecciona un chat para ver la conversación</p>
    </div>

    <form id="composer" class="composer">
      <textarea id="composer-input" rows="1" placeholder="Escribe una respuesta…" autocomplete="off"></textarea>
      <button type="submit" id="composer-send" class="composer__send" aria-label="Enviar">➤</button>
    </form>
  </section>

  <!-- ── Modal Conexiones ─────────────────────────────────────────────────── -->
  <div id="conn-modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Conexiones">
    <div class="modal__backdrop" data-close></div>
    <div class="modal__card">
      <header class="modal__head">
        <h2>Conexiones</h2>
        <button class="icon-btn" data-close aria-label="Cerrar">✕</button>
      </header>
      <div id="conn-body" class="conn-list">
        <div class="empty">Cargando estado…</div>
      </div>
      <p class="conn-note">WhatsApp usa una sesión por QR. Messenger e Instagram dependen del token de Meta.</p>
    </div>
  </div>

  <script src="/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(e => console.error('SW error', e));
      });
    }
  </script>
</body>
</html>
