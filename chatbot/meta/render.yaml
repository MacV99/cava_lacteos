services:
  - type: web
    name: cava-chatbot-meta
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: META_VERIFY_TOKEN
        sync: false
      - key: META_PAGE_ACCESS_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_IG_ACCESS_TOKEN
        sync: false
      # ── WhatsApp Cloud API (canal oficial, mismo servicio) ──────────────────
      - key: META_TOKEN
        sync: false
      - key: PHONE_NUMBER_ID
        sync: false
      - key: WABA_ID
        sync: false
      - key: GRAPH_VERSION
        value: v25.0
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      # ── Persistencia del panel (Supabase de La Cava) ────────────────────────
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # ── Panel admin (UI en / + rutas /api/*) ────────────────────────────────
      - key: PANEL_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # GROQ_CHAT_MODEL: NO se declara aquí a propósito. El modelo vive solo en
      # app/config.py (groq_chat_model) para cambiarlo con 1 commit sin tocar Render.
      - key: GROQ_WHISPER_MODEL
        value: whisper-large-v3
      - key: GOOGLE_SHEETS_ID
        sync: false
      - key: GOOGLE_SA_JSON_B64
        sync: false
      - key: BUFFER_WAIT_SECONDS
        value: "5"
      - key: HISTORY_MAX_ITEMS
        value: "28"
      - key: SESSION_TIMEOUT_MINUTES
        value: "60"
