name: keepalive

# Mantiene despierto el servicio free de Render (se duerme a los ~15 min de inactividad).
# Hace un GET a /healthz periódicamente. No necesita secretos.
on:
  schedule:
    - cron: "*/10 * * * *"   # cada 10 min (GitHub puede retrasarlo algo bajo carga)
  workflow_dispatch: {}        # permite dispararlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping healthz
        run: curl -sSf --max-time 90 https://cava-chatbot-facebook.onrender.com/healthz
